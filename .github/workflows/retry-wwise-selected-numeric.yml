name: W1-AQ bounded original Wwise three-ID diagnostic retry

on:
  pull_request:
    paths:
      - ".github/workflows/retry-wwise-selected-numeric.yml"
      - "reconstruction/tools/wwise_selected_numeric_retry.py"
      - "reconstruction/tests/test_wwise_selected_numeric_retry.py"
      - "reconstruction/data/wwise_selected_numeric_retry.json"
      - "reconstruction/data/wwise_numeric_cap_identities.json"
      - "reconstruction/data/extraction_coverage.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            StreamingAssets/aa/StandaloneWindows64/wwisedata_windows_assets_all.bundle
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original Wwise source and exact selected three sample IDs/pointer
        run: |
          set -euo pipefail
          python -m reconstruction.tools.wwise_selected_numeric_retry plan --ledger reconstruction/data/extraction_coverage.json
          python -m unittest discover -s reconstruction/tests -p test_wwise_selected_numeric_retry.py -v

  inspect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            StreamingAssets/aa/StandaloneWindows64/wwisedata_windows_assets_all.bundle
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Git pointer before downloading original
        run: |
          set -euo pipefail
          python -m reconstruction.tools.wwise_selected_numeric_retry plan --ledger reconstruction/data/extraction_coverage.json
      - name: Download exact original 170 MB Wwise bundle
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="StreamingAssets/aa/StandaloneWindows64/wwisedata_windows_assets_all.bundle" --exclude=""
          git lfs checkout StreamingAssets/aa/StandaloneWindows64/wwisedata_windows_assets_all.bundle
      - name: Install pinned UnityPy (read-only)
        run: python -m pip install UnityPy==1.25.4
      - name: Original Wwise source SHA + bounded three-ID numeric retries
        shell: bash
        run: |
          set -euo pipefail
          python -m reconstruction.tools.wwise_selected_numeric_retry scan --ledger reconstruction/data/extraction_coverage.json --output "$RUNNER_TEMP/wwise-selected-retry.json" &
          scan_pid=$!
          trap 'kill "$scan_pid" 2>/dev/null || true' EXIT
          while kill -0 "$scan_pid" 2>/dev/null; do
            echo "WWISE_SAMPLE_RSS utc=$(date -u +%FT%TZ)"
            if [[ -r "/proc/$scan_pid/status" ]]; then
              grep -E '^(VmRSS|VmHWM|VmPeak):' "/proc/$scan_pid/status" || true
            fi
            if [[ -r /sys/fs/cgroup/memory.events ]]; then
              grep -E '^(oom|oom_kill|oom_group_kill) ' /sys/fs/cgroup/memory.events || true
            fi
            sleep 10
          done
          wait "$scan_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: wwise-selected-numeric-retry-measured
          path: ${{ runner.temp }}/wwise-selected-retry.json
          if-no-files-found: error
          retention-days: 30

  reconcile:
    needs: [plan, inspect]
    if: ${{ needs.plan.result == 'success' && needs.inspect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wwise-selected-numeric-retry-measured
          path: ${{ runner.temp }}
      - name: Strict original Wwise three-ID scoped retry reconciliation
        run: |
          set -euo pipefail
          python -m reconstruction.tools.wwise_selected_numeric_retry reconcile --ledger reconstruction/data/extraction_coverage.json --result "$RUNNER_TEMP/wwise-selected-retry.json"

name: W1-AN identify original city-scene capped MonoBehaviours

on:
  pull_request:
    paths:
      - ".github/workflows/identify-city-cap-identities.yml"
      - "reconstruction/tools/city_cap_index.py"
      - "reconstruction/tests/test_city_cap_index.py"
      - "reconstruction/data/city_scene_numeric_cap_identities.json"
      - "reconstruction/data/extraction_coverage.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            StreamingAssets/aa/StandaloneWindows64/location-city-standalone_scenes_city_standalone.unity.bundle
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict original 330-source ledger and city pointer check
        run: |
          set -euo pipefail
          python -m reconstruction.tools.city_cap_index plan --ledger reconstruction/data/extraction_coverage.json
          python -m unittest discover -s reconstruction/tests -p test_city_cap_index.py -v

  inspect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            StreamingAssets/aa/StandaloneWindows64/location-city-standalone_scenes_city_standalone.unity.bundle
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact Git LFS pointer before fetching original bytes
        run: |
          set -euo pipefail
          python -m reconstruction.tools.city_cap_index plan --ledger reconstruction/data/extraction_coverage.json
      - name: Fetch only the original 549 MB city scene
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="StreamingAssets/aa/StandaloneWindows64/location-city-standalone_scenes_city_standalone.unity.bundle" --exclude=""
          git lfs checkout StreamingAssets/aa/StandaloneWindows64/location-city-standalone_scenes_city_standalone.unity.bundle
      - name: Install pinned read-only UnityPy
        run: python -m pip install UnityPy==1.25.4
      - name: Verify full SHA/size and scan only bounded city numeric-cap identities
        shell: bash
        run: |
          set -euo pipefail
          python -m reconstruction.tools.city_cap_index scan --ledger reconstruction/data/extraction_coverage.json --output "$RUNNER_TEMP/city-cap-index.json" &
          scan_pid=$!
          trap 'kill "$scan_pid" 2>/dev/null || true' EXIT
          while kill -0 "$scan_pid" 2>/dev/null; do
            echo "CITY_CAP_RSS utc=$(date -u +%FT%TZ)"
            if [[ -r "/proc/$scan_pid/status" ]]; then
              grep -E '^(VmRSS|VmHWM|VmPeak):' "/proc/$scan_pid/status" || true
            fi
            if [[ -r /sys/fs/cgroup/memory.events ]]; then
              grep -E '^(oom|oom_kill|oom_group_kill) ' /sys/fs/cgroup/memory.events || true
            fi
            sleep 10
          done
          wait "$scan_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: city-cap-identities-measured
          path: ${{ runner.temp }}/city-cap-index.json
          if-no-files-found: error
          retention-days: 30

  reconcile:
    needs: [plan, inspect]
    if: ${{ needs.plan.result == 'success' && needs.inspect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: city-cap-identities-measured
          path: ${{ runner.temp }}
      - name: Strict five-object original-source cap identity reconciliation
        run: |
          set -euo pipefail
          python -m reconstruction.tools.city_cap_index reconcile --ledger reconstruction/data/extraction_coverage.json --index "$RUNNER_TEMP/city-cap-index.json"

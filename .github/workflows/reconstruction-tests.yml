name: Reconstruction rules and audit tests

on:
  push:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction-tests.yml"
  pull_request:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authored reconstruction code only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test evidence tools and gameplay rules
        run: python -m unittest discover -s reconstruction/tests -v
      - name: Lint Unity Editor and Play Mode runners (does not run Unity)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @(
            "reconstruction/unity-prototype/Tools/Verify-Unity.ps1",
            "reconstruction/unity-prototype/Tools/Verify-PlayMode.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }

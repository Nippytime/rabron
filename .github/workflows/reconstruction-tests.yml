name: Reconstruction rules and audit tests

on:
  push:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction-tests.yml"
  pull_request:
    paths:
      - "reconstruction/**"
      - ".github/workflows/reconstruction-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authored reconstruction code only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            .github/workflows/extract-gameplay-bundles.yml
            .github/workflows/reconstruction-tests.yml
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test evidence tools and gameplay rules
        run: python -m unittest discover -s reconstruction/tests -v
      - name: Inventory all tracked reference bundles without downloading them
        run: |
          python reconstruction/tools/plan_bundle_scans.py \
            --ref HEAD --min-tracked 330 \
            --output "$RUNNER_TEMP/bundle-scan-backlog.json"
      - name: Preserve extraction gap backlog (not proprietary game assets)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-scan-backlog
          path: ${{ runner.temp }}/bundle-scan-backlog.json
          if-no-files-found: error
          retention-days: 30
      - name: Lint Unity Editor and Play Mode runners (does not run Unity)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @(
            "reconstruction/unity-prototype/Tools/Verify-Unity.ps1",
            "reconstruction/unity-prototype/Tools/Verify-PlayMode.ps1",
            "reconstruction/unity-prototype/Tools/Assert-PlayModeResults.ps1",
            "reconstruction/unity-prototype/Tools/Test-PlayModeResults.ps1",
            "reconstruction/unity-prototype/Tools/Verify-Acceptance.ps1",
            "reconstruction/unity-prototype/Tools/Assert-UnitySourceTree.ps1",
            "reconstruction/unity-prototype/Tools/Test-AcceptanceGate.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }
      - name: Exercise fake NUnit result gates (does not execute Unity)
        shell: pwsh
        run: |
          & ./reconstruction/unity-prototype/Tools/Test-PlayModeResults.ps1
      - name: Reject missing Unity and stale acceptance manifest (synthetic only)
        shell: pwsh
        run: |
          & ./reconstruction/unity-prototype/Tools/Test-AcceptanceGate.ps1

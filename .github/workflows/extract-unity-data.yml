name: Extract original ScriptableObject evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "reconstruction/tools/extract_unity_bundle.py"
      - "reconstruction/tests/test_extract_unity_bundle.py"
      - ".github/workflows/extract-unity-data.yml"
  pull_request:
    paths:
      - "reconstruction/tools/extract_unity_bundle.py"
      - "reconstruction/tests/test_extract_unity_bundle.py"
      - ".github/workflows/extract-unity-data.yml"

permissions:
  contents: read

jobs:
  asset-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            reconstruction/
            .github/workflows/extract-gameplay-bundles.yml
            StreamingAssets/aa/StandaloneWindows64/scriptableobjects_assets_all.bundle
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install known UnityPy version
        run: python -m pip install UnityPy==1.25.4
      - name: Run pure reference and scanner tests
        run: python -m unittest discover -s reconstruction/tests -v
      - name: Scan original ScriptableObject bundle
        run: |
          python reconstruction/tools/extract_unity_bundle.py \
            StreamingAssets/aa/StandaloneWindows64/scriptableobjects_assets_all.bundle \
            --max-fields 4096 \
            --output "$RUNNER_TEMP/scriptableobjects-index.json"
      - name: Preserve machine-readable evidence (including partial extraction)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scriptableobjects-index
          path: ${{ runner.temp }}/scriptableobjects-index.json
          if-no-files-found: warn
          retention-days: 30
